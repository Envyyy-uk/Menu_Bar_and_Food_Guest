<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smith &amp; Wollensky — Menu &amp; Bar Guide</title>
<meta name="description" content="Smith &amp; Wollensky menu guide: brunch, lunch, dinner and drinks, with full ingredient lists and allergens in six languages.">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <b>Smith &amp; Wollensky</b>
      <span data-i18n="brand.sub"></span>
    </a>
    <nav class="nav">
      <a href="index.html" aria-current="page" data-i18n="nav.home"></a>
      <a href="brunch.html" data-i18n="nav.brunch"></a>
      <a href="lunch.html" data-i18n="nav.lunch"></a>
      <a href="dinner.html" data-i18n="nav.dinner"></a>
      <a href="drinks.html" data-i18n="nav.drinks"></a>
      <a href="allergens.html" data-i18n="nav.allergens"></a>
    </nav>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <h1 data-i18n="home.title"></h1>
    <div class="rule"></div>
    <p data-i18n="home.lead"></p>
  </section>

  <div class="cards">
    <a class="card" href="brunch.html">
      <span class="kicker">Brunch Menu</span>
      <h2 data-i18n="nav.brunch"></h2>
      <p data-i18n="card.brunch"></p>
      <span class="count" data-count="brunch"></span>
    </a>
    <a class="card" href="lunch.html">
      <span class="kicker">Lunch Menu</span>
      <h2 data-i18n="nav.lunch"></h2>
      <p data-i18n="card.lunch"></p>
      <span class="count" data-count="lunch"></span>
    </a>
    <a class="card" href="dinner.html">
      <span class="kicker">Dinner Menu</span>
      <h2 data-i18n="nav.dinner"></h2>
      <p data-i18n="card.dinner"></p>
      <span class="count" data-count="dinner"></span>
    </a>
    <a class="card" href="drinks.html">
      <span class="kicker">Bar &amp; Wine</span>
      <h2 data-i18n="nav.drinks"></h2>
      <p data-i18n="card.drinks"></p>
      <span class="count" data-count="drinks"></span>
    </a>
    <a class="card accent" href="allergens.html">
      <span class="kicker">Allergens</span>
      <h2 data-i18n="nav.allergens"></h2>
      <p data-i18n="card.allergens"></p>
      <span class="count" data-count="all"></span>
    </a>
  </div>

  <div class="notice" data-i18n="notice.home"></div>

  <section class="section">
    <p class="section-en" data-i18n="howto.title"></p>
    <div class="cards">
      <div class="card">
        <h2 class="small" data-i18n="howto.1.t"></h2>
        <p data-i18n="howto.1.d"></p>
      </div>
      <div class="card">
        <h2 class="small" data-i18n="howto.2.t"></h2>
        <p data-i18n="howto.2.d"></p>
      </div>
      <div class="card">
        <h2 class="small" data-i18n="howto.3.t"></h2>
        <p data-i18n="howto.3.d"></p>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <span data-i18n="footer.name"></span>
    <span data-i18n="footer.prices"></span>
  </div>
</footer>

<script src="assets/i18n.js"></script>
<script src="assets/lexicon.js"></script>
<script src="assets/allergens.js"></script>
<script src="assets/data-food.js"></script>
<script src="assets/data-drinks.js"></script>
<script src="assets/app.js"></script>
<script>initPage({ kind: 'home' });</script>
</body>
</html>
