<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allergens — Smith &amp; Wollensky</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <b>Smith &amp; Wollensky</b>
      <span data-i18n="brand.sub"></span>
    </a>
    <nav class="nav">
      <a href="index.html" data-i18n="nav.home"></a>
      <a href="brunch.html" data-i18n="nav.brunch"></a>
      <a href="lunch.html" data-i18n="nav.lunch"></a>
      <a href="dinner.html" data-i18n="nav.dinner"></a>
      <a href="drinks.html" data-i18n="nav.drinks"></a>
      <a href="allergens.html" aria-current="page" data-i18n="nav.allergens"></a>
    </nav>
  </div>
</header>

<div id="toolbar"></div>

<main class="wrap">
  <section class="hero">
    <h1 data-i18n="page.allergens.title"></h1>
    <div class="rule"></div>
    <p data-i18n="page.allergens.lead"></p>
    <p class="legend-key">
      <span class="mark-yes">●</span> <span data-i18n="legend.contains"></span>
      &nbsp;·&nbsp;
      <span class="mark-maybe">○</span> <span data-i18n="legend.may"></span>
    </p>
  </section>

  <div class="notice" data-i18n="notice.allergens"></div>

  <section class="section">
    <h2 data-i18n="legend.title"></h2>
    <p class="section-en" data-i18n="legend.sub"></p>
    <div id="legend"></div>
  </section>

  <section class="section">
    <h2 data-i18n="matrix.title"></h2>
    <p class="section-en" data-i18n="matrix.sub"></p>
    <p class="section-note" data-i18n="matrix.note"></p>
    <div id="matrix"></div>
  </section>

  <section class="section">
    <h2 data-i18n="tips.title"></h2>
    <p class="section-en" data-i18n="tips.sub"></p>
    <div class="cards">
      <div class="card"><h2 class="small" data-i18n="tip.1.t"></h2><p data-i18n="tip.1.d"></p></div>
      <div class="card"><h2 class="small" data-i18n="tip.2.t"></h2><p data-i18n="tip.2.d"></p></div>
      <div class="card"><h2 class="small" data-i18n="tip.3.t"></h2><p data-i18n="tip.3.d"></p></div>
      <div class="card"><h2 class="small" data-i18n="tip.4.t"></h2><p data-i18n="tip.4.d"></p></div>
      <div class="card"><h2 class="small" data-i18n="tip.5.t"></h2><p data-i18n="tip.5.d"></p></div>
      <div class="card"><h2 class="small" data-i18n="tip.6.t"></h2><p data-i18n="tip.6.d"></p></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span><a href="index.html" data-i18n="footer.back"></a></span>
    <span data-i18n="footer.prices"></span>
  </div>
</footer>

<script src="assets/i18n.js"></script>
<script src="assets/lexicon.js"></script>
<script src="assets/allergens.js"></script>
<script src="assets/data-food.js"></script>
<script src="assets/data-drinks.js"></script>
<script src="assets/app.js"></script>
<script>initPage({ kind: 'allergens' });</script>
</body>
</html>
