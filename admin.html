<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#14322a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="S&amp;W Admin">
<link rel="apple-touch-icon" href="assets/icons/admin-192.png">
<link rel="icon" href="assets/icons/admin-192.png">
<script src="assets/pwa.js"></script>
<meta name="robots" content="noindex, nofollow">
<title>Admin — Smith &amp; Wollensky</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="admin">

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <b>Smith &amp; Wollensky</b>
      <span data-i18n="adm.sub"></span>
    </a>
    <nav class="nav">
      <a href="index.html" data-i18n="adm.back"></a>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- керування нагорі: у залі його відкривають, щоб швидко щось закрити -->
  <div class="abar">
    <div class="atabs">
      <button class="atab on" data-tab="items" type="button" data-i18n="adm.tab.items"></button>
      <button class="atab" data-tab="sections" type="button" data-i18n="adm.tab.sections"></button>
      <button class="atab" data-tab="pages" type="button" data-i18n="adm.tab.pages"></button>
      <button class="atab" data-tab="schedules" type="button" data-i18n="adm.tab.schedules"></button>
    </div>
    <input id="asearch" class="search" type="search" data-i18n-ph="adm.search">
    <span class="aclock" id="clock"></span>
  </div>

  <p id="unpub" class="unpub" style="display:none"></p>

  <div class="aactions">
    <button id="export" class="filter-toggle" type="button"></button>
    <button id="ghtoken" class="filter-toggle" type="button"></button>
    <button id="copy" class="filter-toggle" type="button" data-i18n="adm.copy"></button>
    <button id="reset" class="clear-btn" type="button" data-i18n="adm.reset"></button>
  </div>
  <textarea id="dump" class="adump" readonly style="display:none"></textarea>

  <details class="anote">
    <summary data-i18n="adm.notice.summary"></summary>
    <p data-i18n="adm.notice.how"></p>
    <p data-i18n="adm.notice.security"></p>
    <p><span data-i18n="adm.origin"></span> <code id="aorigin"></code></p>
  </details>

  <div id="panel"></div>
</main>

<footer>
  <div class="wrap">
    <span><a href="index.html" data-i18n="footer.back"></a></span>
    <span data-i18n="adm.footer"></span>
  </div>
</footer>

<script src="assets/i18n.js"></script>
<script src="assets/lexicon.js"></script>
<script src="assets/allergens.js"></script>
<script src="assets/data-food.js"></script>
<script src="assets/data-drinks.js"></script>
<script src="assets/data-official.js"></script>
<script src="assets/data-desserts.js"></script>
<script src="assets/data-spirits.js"></script>
<script src="assets/overrides.js"></script>
<script src="assets/schedule.js"></script>
<script>
  // панелі потрібен той самий об'єднаний набір позицій, що й сайту
  DISHES.push(...DRESSINGS, ...CANAPES, ...DESSERTS);
  DRINKS.push(...DESSERT_COCKTAILS, ...HOT_DRINKS, ...SPIRITS);
  const DESSERT_WINE_ORDER = ['dessertwine', 'port', 'sherry'];
</script>
<script src="assets/admin.js"></script>
<script>initAdmin();</script>
</body>
</html>
